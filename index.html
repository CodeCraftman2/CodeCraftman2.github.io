<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Yagya Saini — Portfolio</title>
    <meta
      name="description"
      content="Yagya Saini, backend developer. Open the live portfolio: projects, experience, resume and live stats."
    />
    <link rel="canonical" href="https://yagya-portfolio-theta.vercel.app/" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="theme-color" content="#09090b" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Yagya Saini — Portfolio" />
    <meta
      property="og:description"
      content="Backend developer. Open the live portfolio."
    />
    <meta property="og:url" content="https://yagya-portfolio-theta.vercel.app/" />
    <meta property="og:image" content="https://codecraftman2.github.io/preview.jpg" />
    <meta name="twitter:card" content="summary_large_image" />

    <style>
      :root {
        --bg: #09090b;
        --panel: #111114;
        --ink: #eceae4;
        --ash: #9ca3af;
        --signal: #5b8cff;
        --line: rgba(255, 255, 255, 0.12);
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html {
        background: var(--bg);
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px 16px;
        color: var(--ink);
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background:
          radial-gradient(60% 50% at 20% 0%, rgba(91, 140, 255, 0.18), transparent 70%),
          radial-gradient(50% 45% at 90% 10%, rgba(167, 139, 250, 0.14), transparent 70%),
          var(--bg);
      }
      main {
        width: min(100%, 980px);
        text-align: center;
      }
      .eyebrow {
        margin: 0 0 14px;
        font:
          500 12px/1 ui-monospace,
          "SF Mono",
          Menlo,
          Consolas,
          monospace;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--signal);
      }
      h1 {
        margin: 0;
        font-size: clamp(36px, 7vw, 68px);
        line-height: 1;
        letter-spacing: -0.04em;
      }
      h1 em {
        font-family: Georgia, "Times New Roman", serif;
        font-weight: 400;
        color: var(--signal);
      }
      .lede {
        margin: 14px auto 28px;
        max-width: 34rem;
        color: var(--ash);
        font-size: 17px;
        line-height: 1.5;
      }
      .shot {
        position: relative;
        display: block;
        overflow: hidden;
        border-radius: 22px;
        border: 1px solid var(--line);
        background: var(--panel);
        box-shadow: 0 30px 80px -30px rgba(0, 0, 0, 0.8);
        transition:
          transform 0.5s cubic-bezier(0.16, 1, 0.3, 1),
          border-color 0.3s ease,
          box-shadow 0.5s ease;
      }
      .shot img {
        display: block;
        width: 100%;
        height: auto;
      }
      .shot::after {
        content: "Open the live portfolio ↗";
        position: absolute;
        inset: auto 0 0 0;
        padding: 56px 16px 18px;
        font:
          600 15px/1 system-ui,
          sans-serif;
        letter-spacing: 0.02em;
        color: #fff;
        background: linear-gradient(to top, rgba(9, 9, 11, 0.92), transparent);
        opacity: 0;
        transform: translateY(8px);
        transition:
          opacity 0.3s ease,
          transform 0.3s ease;
      }
      .shot:hover,
      .shot:focus-visible {
        transform: translateY(-4px);
        border-color: var(--signal);
        box-shadow: 0 40px 90px -30px rgba(91, 140, 255, 0.45);
        outline: none;
      }
      .shot:hover::after,
      .shot:focus-visible::after {
        opacity: 1;
        transform: none;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
        margin-top: 28px;
      }
      .btn {
        display: inline-flex;
        min-height: 46px;
        align-items: center;
        padding: 0 24px;
        border-radius: 999px;
        font-weight: 600;
        font-size: 15px;
        text-decoration: none;
        color: var(--ink);
        border: 1px solid var(--line);
        transition:
          transform 0.25s ease,
          border-color 0.25s ease;
      }
      .btn:hover {
        transform: translateY(-2px);
        border-color: var(--ink);
      }
      .btn.primary {
        background: var(--signal);
        border-color: var(--signal);
        color: #09090b;
      }
      .btn.primary:hover {
        filter: brightness(1.1);
      }
      .links {
        margin-top: 22px;
        font:
          500 12px/1 ui-monospace,
          Menlo,
          Consolas,
          monospace;
        letter-spacing: 0.08em;
        color: var(--ash);
      }
      .links a {
        color: var(--ash);
        text-decoration: none;
        margin: 0 10px;
      }
      .links a:hover {
        color: var(--ink);
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Backend developer</p>
      <h1>Yagya <em>Saini</em></h1>
      <p class="lede">
        My portfolio lives on its own site now. Click the preview to open it.
      </p>

      <a
        class="shot"
        href="https://yagya-portfolio-theta.vercel.app/"
        aria-label="Open the live portfolio at yagya-portfolio-theta.vercel.app"
      >
        <img
          src="/preview.jpg"
          width="1440"
          height="900"
          alt="Screenshot of the portfolio's home page: the name Yagya Saini, a dot-sphere graphic and a card showing what I'm playing right now"
        />
      </a>

      <div class="actions">
        <a class="btn primary" href="https://yagya-portfolio-theta.vercel.app/"
          >Open portfolio</a
        >
        <a class="btn" href="https://yagya-portfolio-theta.vercel.app/resume"
          >Resume</a
        >
      </div>

      <p class="links">
        <a href="https://github.com/CodeCraftman2">GitHub</a>·
        <a href="https://www.linkedin.com/in/yagya-saini-05739a267/">LinkedIn</a>
      </p>
    </main>
  </body>
</html>
